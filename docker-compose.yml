version: '3.8'

services:
  # Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev 
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./server:/app
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000

  # Frontend Client
  client:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./client:/app
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
