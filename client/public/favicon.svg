<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 6 88 88">
  <style>
    .icon { fill: none; stroke: #1e40af; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .text { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; fill: #1e40af; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <!-- AHL Logo in the Middle -->
  <g transform="translate(15, 15) scale(0.7)">
    <!-- Green Polygon -->
    <polygon points="33,44 43,38 43,62 33,56" fill="#2fa84f" />
    <text x="38" y="50" dy="0.35em" font-family="sans-serif" font-size="12px" font-weight="bold" fill="white" text-anchor="middle">A</text>
    
    <!-- Yellow Polygon -->
    <polygon points="45,38 55,38 55,62 45,62" fill="#fbbc05" />
    <text x="50" y="50" dy="0.35em" font-family="sans-serif" font-size="12px" font-weight="bold" fill="white" text-anchor="middle">H</text>
    
    <!-- Red Polygon -->
    <polygon points="57,38 67,44 67,56 57,62" fill="#ea4335" />
    <text x="62" y="50" dy="0.35em" font-family="sans-serif" font-size="12px" font-weight="bold" fill="white" text-anchor="middle">L</text>
  </g>

  <!-- Connective Arcs -->
  <g class="icon">
    <!-- Top-Right -->
    <path d="M 68 22 A 38 38 0 0 1 78 32" />
    <!-- Right-Bottom -->
    <path d="M 78 68 A 38 38 0 0 1 68 78" />
    <!-- Bottom-Left -->
    <path d="M 32 78 A 38 38 0 0 1 22 68" />
    <!-- Left-Top -->
    <path d="M 22 32 A 38 38 0 0 1 32 22" />
  </g>

  <!-- 4 Team Members -->
  <g class="icon">
    <!-- Top Member -->
    <circle cx="50" cy="14" r="6" />
    <path d="M 38 32 C 38 22, 62 22, 62 32 Z" />

    <!-- Bottom Member -->
    <circle cx="50" cy="86" r="6" />
    <path d="M 38 68 C 38 78, 62 78, 62 68 Z" />

    <!-- Left Member -->
    <circle cx="14" cy="50" r="6" />
    <path d="M 32 38 C 22 38, 22 62, 32 62 Z" />

    <!-- Right Member -->
    <circle cx="86" cy="50" r="6" />
    <path d="M 68 38 C 78 38, 78 62, 68 62 Z" />
  </g>
</svg>