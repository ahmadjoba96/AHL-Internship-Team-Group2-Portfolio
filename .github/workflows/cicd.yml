name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies (Client)
        working-directory: ./client
        run: npm ci

      - name: Lint and Type Check (Client)
        working-directory: ./client
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Install dependencies (Server)
        working-directory: ./server
        run: npm ci

      - name: Lint (Server)
        working-directory: ./server
        run: npm run lint || echo "No server lint script yet"

  docker-build-and-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ahl-portfolio:latest .
        
      - name: Trigger Render Deployment
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
            echo "Deployment triggered successfully!"
          else
            echo "RENDER_DEPLOY_HOOK secret not set. Skipping deployment."
          fi
